[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atscale-pbi-transpile"
version = "0.0.1"
description = "DAX -> MDX transpiler for Power BI Tabular Model files. Emits OSI-conformant SML YAML."
authors = [{name = "AtScale"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dax", "mdx", "power-bi", "sml", "osi", "semantic-layer", "transpiler"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "antlr4-python3-runtime>=4.13",
    "ruamel.yaml>=0.18",
    "pydantic>=2.5",
    "pyshacl>=0.25",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
atscale-pbi-transpile = "atscale_pbi_transpile.cli:main"

[project.urls]
Homepage = "https://github.com/atscaleinc/atscale-pbi-transpile"
Issues = "https://github.com/atscaleinc/atscale-pbi-transpile/issues"
OSI = "https://open-semantic-interchange.org"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
